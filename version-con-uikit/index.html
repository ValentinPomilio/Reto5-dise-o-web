<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomiGames - UIkit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.21.12/dist/css/uikit.min.css" />
    <link rel="stylesheet" href="css/estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.21.12/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.21.12/dist/js/uikit-icons.min.js"></script>
</head>
<body class="uk-background-secondary uk-light uk-flex uk-flex-column uk-height-viewport uk-flex-between">
    <header class="uk-background-secondary uk-box-shadow-medium uk-position-z-index uk-sticky" uk-sticky>
        <section class="uk-container uk-padding-small">
            <nav class="uk-navbar-container uk-navbar-transparent" uk-navbar>
                <section class="uk-navbar-left">
                    <h1 class="uk-navbar-item uk-logo uk-margin-remove">
                        <a href="index.html" class="uk-link-reset text-white">PomiGames</a>
                    </h1>
                </section>
                <section class="uk-navbar-right">
                    <ul class="uk-navbar-nav">
                        <li class="uk-active"><a href="index.html">Inicio</a></li>
                        <li><a href="#games">Juegos</a></li>
                        <li><a href="#contacto">Contacto</a></li>
                    </ul>
                </section>
            </nav>
        </section>
    </header>
    <main class="uk-flex-1">
        <section class="uk-cover-container uk-height-viewport uk-flex uk-flex-center uk-flex-middle">
            <img src="img/port.jpg" alt="Portada PomiGames" uk-cover class="uk-blur">
            <article class="uk-overlay uk-overlay-primary uk-position-cover uk-flex uk-flex-column uk-flex-center uk-flex-middle uk-text-center">
                <h2 class="uk-heading-medium uk-margin-remove font-bold">PomiGames</h2>
                <p class="uk-text-lead uk-margin-small-top">¡Los juegos más jugados!</p>
                <a href="#games" class="uk-button uk-button-primary uk-button-large uk-margin-medium-top uk-border-rounded">
                    Ver Juegos
                </a>
            </article>
        </section>
        <section id="games" class="uk-section uk-container">
            <section class="uk-grid-match uk-child-width-1-1 uk-child-width-1-2@s uk-child-width-1-3@m" uk-grid>
                <article>
                    <figure class="uk-card uk-card-secondary uk-card-hover uk-flex uk-flex-column uk-height-1-1 uk-margin-remove uk-border-rounded overflow-hidden">
                        <section class="uk-card-media-top">
                            <img src="img/halo_5.jpg" alt="Halo 5: Guardians" class="uk-height-small uk-width-1-1 uk-object-cover">
                        </section>
                        <figcaption class="uk-card-body uk-flex-1">
                            <h3 class="uk-card-title uk-margin-remove-bottom">Halo 5: Guardians</h3>
                            <p class="uk-text-meta uk-margin-small-top">Shooter de ciencia ficción donde la historia se divide entre Master Chief y el Spartan Locke.</p>
                        </figcaption>
                        <footer class="uk-card-footer">
                            <a href="detalle_producto.html" class="uk-button uk-button-primary uk-width-1-1">Ver Detalle</a>
                        </footer>
                    </figure>
                </article>
                <article>
                    <figure class="uk-card uk-card-secondary uk-card-hover uk-flex uk-flex-column uk-height-1-1 uk-margin-remove uk-border-rounded overflow-hidden">
                        <section class="uk-card-media-top">
                            <img src="img/spider_man.jpg" alt="Spider-Man" class="uk-height-small uk-width-1-1 uk-object-cover">
                        </section>
                        <figcaption class="uk-card-body uk-flex-1">
                            <h3 class="uk-card-title uk-margin-remove-bottom">Spider-Man</h3>
                            <p class="uk-text-meta uk-margin-small-top">Aclamado juego de acción en mundo abierto protagonizado por Peter Parker en Nueva York.</p>
                        </figcaption>
                        <footer class="uk-card-footer">
                            <a href="detalle_producto.html" class="uk-button uk-button-primary uk-width-1-1">Ver Detalle</a>
                        </footer>
                    </figure>
                </article>
                <article>
                    <figure class="uk-card uk-card-secondary uk-card-hover uk-flex uk-flex-column uk-height-1-1 uk-margin-remove uk-border-rounded overflow-hidden">
                        <section class="uk-card-media-top">
                            <img src="img/mortal_kombat.jpg" alt="Mortal Kombat" class="uk-height-small uk-width-1-1 uk-object-cover">
                        </section>
                        <figcaption class="uk-card-body uk-flex-1">
                            <h3 class="uk-card-title uk-margin-remove-bottom">Mortal Kombat</h3>
                            <p class="uk-text-meta uk-margin-small-top">Franquicia icónica de lucha famosa por sus dinámicas de combate y sangrientos Fatalities.</p>
                        </figcaption>
                        <footer class="uk-card-footer">
                            <a href="detalle_producto.html" class="uk-button uk-button-primary uk-width-1-1">Ver Detalle</a>
                        </footer>
                    </figure>
                </article>

            </section>
        </section>
    </main>

    <footer id="contacto" class="uk-section uk-section-xsmall">
    <section class="uk-container flex-col sm:flex-row uk-flex uk-flex-between uk-flex-middle">
        <p class="uk-margin-remove">&copy; 2026 PomiGames. Todos los derechos reservados.</p>
        <nav>
            <ul class="uk-subnav uk-margin-remove">
                <li><a href="#">Política de Privacidad</a></li>
                <li><a href="#">Términos de Servicio</a></li>
            </ul>
        </nav>
    </section>
</footer>

</body>
</html>
